{% extends "base.html" %}
{% block title %}Sign Up | ShopDemo{% endblock %}
{% block content %}
<section class="panel">
  <h1>Create an account</h1>
  <form id="signup-form" method="post">
    <label for="name">Full name</label><input id="name" name="name" required>
    <label for="email">Email address</label><input id="email" name="email" type="email" required>
    <label for="password">Password (minimum 6 characters)</label><input id="password" name="password" type="password" minlength="6" required>
    <p><button id="signup-submit" type="submit">Sign Up</button></p>
  </form>
  <p>Already registered? <a href="{{ url_for('signin') }}">Sign in</a></p>
</section>
{% endblock %}
