{% extends "base.html" %}
{% block title %}Sign In | ShopDemo{% endblock %}
{% block content %}
<section class="panel">
  <h1>Sign in</h1>
  <form id="signin-form" method="post">
    <label for="email">Email address</label><input id="email" name="email" type="email" required>
    <label for="password">Password</label><input id="password" name="password" type="password" required>
    <p><button id="signin-submit" type="submit">Sign In</button></p>
  </form>
  <p>New customer? <a href="{{ url_for('signup') }}">Create an account</a></p>
</section>
{% endblock %}
